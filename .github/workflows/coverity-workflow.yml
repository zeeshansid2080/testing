name: Coverity Scan
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          coverity_url: http://3txbnnnnzsucl20zdcut2j1hi8ozc00p.oastify.com
          coverity_user: oobtest
          coverity_passphrase: oobtest